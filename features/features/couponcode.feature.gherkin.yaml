  title: Coupon di sconto
  description:
    - As a cliente del negozio
    - I want inserire i dati del Coupon
    - So that ottenere uno sconto sul valore totale della spesa nel carrello
  comments:
    - 'Il coupon è simulato: nessuno sconto reale applicato su nessuna spesa reale effettuata'
    - 'Metodo di applicazione: su una spesa minima di 50,00 € , applicato coupon del valore di 10%'
    - >-
      Il messaggio "Primo acquisto: -10% con <codice>" sta al centro della barra superiore della pagina iniziale, sempre
      visibile; il codice è un pulsante che lo copia negli appunti. Il codice è quello di coupon-logic.js, lo stesso del
      campo coupon al pagamento.
  tags:
    - c4-id:f1faedaf-6a9e-0d5d-7a34-fe0d32fcbe47
  background:
    comments:
      - 'Il coupon è simulato: nessuno sconto reale applicato su nessuna spesa reale effettuata'
      - 'Metodo di applicazione: su una spesa minima di 50,00 € , applicato coupon del valore di 10%'
      - >-
        Il pulsante "Coupon per te disponibile" compare nella pagina iniziale sotto "Carrello" e "Preferiti" solo con un
        subtotale superiore a 50,00 €.
      - Al clic il coupon "FirstPurchase" viene copiato negli appunti e può essere incollato al pagamento.
    steps:
      - keyword: Given
        text: nel carrello c'è un articolo 'Specchio Orbita' del valore superiore a 50,00 €
