<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogo E-commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20261026-back-button-standard-1" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="logo">E</div>
        <div>
          <p class="eyebrow">Shop</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="cart-pill cart-link" href="/carrello">
          <span>Carrello</span>
          <strong id="cart-count">0</strong>
        </a>
        <a id="favorites-link" class="favorites-link" href="/preferiti">
          Preferiti <strong id="favorites-count">0</strong>
        </a>
        <div id="coupon-container" class="coupon-container" hidden>
          <button id="coupon-copy" class="checkout-button coupon-toggle" type="button">Coupon per te disponibile</button>
          <p id="coupon-copy-feedback" class="coupon-applied" role="status" aria-live="polite" hidden></p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="catalog-panel">
        <div id="look-scene-container"></div>
        <h1 id="page-title" class="catalog-title">Scopri</h1>
        <a id="frame-configurator-link" class="frame-configurator-link" href="/configuratore-cornice" hidden>Crea la tua cornice</a>
        <div class="toolbar">
          <div class="search-box">
            <label for="search-input">Cerca prodotto</label>
            <input id="search-input" type="search" placeholder="Es. lampada, vaso..." />
          </div>

          <div class="select-box">
            <label for="sort-select">Ordina per</label>
            <select id="sort-select">
              <option value="featured">In evidenza</option>
              <option value="price-asc">Prezzo: basso - alto</option>
              <option value="price-desc">Prezzo: alto - basso</option>
              <option value="name">Nome</option>
            </select>
          </div>
        </div>

        <div id="category-filters" class="category-filters" aria-label="Filtri categoria"></div>
        <div id="product-list" class="product-list" aria-live="polite"></div>
      </section>

      <aside class="cart-panel">
        <div class="cart-header">
          <h2>Il tuo carrello</h2>
          <span id="items-count">0 articoli</span>
        </div>

        <div id="cart-items" class="cart-items"></div>

        <div class="totals">
          <div class="row">
            <span>Subtotale</span>
            <strong id="subtotal">€ 0,00</strong>
          </div>
          <div class="row">
            <span>Spedizione</span>
            <strong id="shipping">€ 0,00</strong>
          </div>
          <div class="row total-row">
            <span>Totale</span>
            <strong id="total">€ 0,00</strong>
          </div>
        </div>

        <a id="cart-checkout-button" class="checkout-button" href="/pagamento" hidden>Vai al pagamento</a>
      </aside>
    </main>

    <script type="module" src="/app.js?v=20261026-cart-quantity-order-1"></script>
  </body>
</html>
