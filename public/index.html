<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogo E-commerce</title>
    <script>try { if (localStorage.getItem('e-commerce-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (error) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20261125-theme-1" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-column">
        <!-- §REQ:LNG-7T2YSF — il pulsante della lingua sta in alto a sinistra, sopra il logo "E" -->
        <div id="language-switcher" class="language-switcher" hidden>
          <button id="language-button" class="checkout-button language-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu">ITA</button>
          <div id="language-menu" class="language-menu" role="listbox" aria-label="Scegli la lingua" hidden></div>
        </div>
        <div class="brand-wrap">
          <div class="logo">E</div>
          <div>
            <p class="eyebrow">Shop</p>
          </div>
        </div>
        <!-- §REQ:MDLT-GRN-NTT-8TY6QK — il pulsante giorno/notte sta subito sotto il logo -->
        <button id="theme-button" class="checkout-button theme-button" type="button" aria-label="Passa alla modalità notte">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="5" x2="12" y2="2.5"/><line x1="16.95" y1="7.05" x2="18.72" y2="5.28"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="16.95" y1="16.95" x2="18.72" y2="18.72"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="7.05" y1="16.95" x2="5.28" y2="18.72"/><line x1="5" y1="12" x2="2.5" y2="12"/><line x1="7.05" y1="7.05" x2="5.28" y2="5.28"/></svg>
        </button>
      </div>
      <div class="header-actions">
        <a class="cart-pill cart-link" href="/carrello">
          <span>Carrello</span>
          <strong id="cart-count">0</strong>
        </a>
        <a id="favorites-link" class="favorites-link" href="/preferiti">
          Preferiti <strong id="favorites-count">0</strong>
        </a>
        <div id="coupon-container" class="coupon-container" hidden>
          <button id="coupon-copy" class="checkout-button coupon-toggle" type="button">Coupon per te disponibile</button>
          <p id="coupon-copy-feedback" class="coupon-applied" role="status" aria-live="polite" hidden></p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="catalog-panel">
        <div id="look-scene-container"></div>
        <h1 id="page-title" class="catalog-title">Scopri</h1>
        <div class="toolbar">
          <div class="search-box">
            <label for="search-input">Cerca prodotto</label>
            <input id="search-input" type="search" placeholder="Es. lampada, vaso..." />
          </div>

          <div class="select-box">
            <label for="sort-select">Ordina per</label>
            <select id="sort-select">
              <option value="featured">In evidenza</option>
              <option value="price-asc">Prezzo: basso - alto</option>
              <option value="price-desc">Prezzo: alto - basso</option>
              <option value="name">Nome</option>
            </select>
          </div>
        </div>

        <div id="category-controls" class="category-controls">
          <div id="category-filters" class="category-filters" aria-label="Filtri categoria"></div>
          <!-- §REQ:PRSN-CRNC-TMM-010, §REQ:PRSN-CRNC-TMM-020 — un solo collegamento al configuratore, sotto il titolo Scopri -->
          <a id="frame-configurator-link" class="frame-configurator-link" href="/configuratore-cornice" hidden>Crea la tua cornice</a>
        </div>
        <div id="product-list" class="product-list" aria-live="polite"></div>
      </section>

      <aside class="cart-panel">
        <div class="cart-header">
          <h2>Il tuo carrello</h2>
          <span id="items-count">0 articoli</span>
        </div>

        <div id="cart-items" class="cart-items"></div>

        <div class="totals">
          <p id="free-shipping" class="free-shipping-bar" role="status" hidden></p>
          <div class="row">
            <span>Subtotale</span>
            <strong id="subtotal">€ 0,00</strong>
          </div>
          <div class="row">
            <span>Spedizione</span>
            <strong id="shipping">€ 0,00</strong>
          </div>
          <div class="row total-row">
            <span>Totale</span>
            <strong id="total">€ 0,00</strong>
          </div>
        </div>

        <a id="cart-checkout-button" class="checkout-button" href="/pagamento" hidden>Vai al pagamento</a>
      </aside>
    </main>

    <script type="module" src="/app.js?v=20261026-cart-quantity-order-1"></script>
  </body>
</html>
